<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6b4fc8"><link rel="manifest" href="manifest.webmanifest"><title>Partitura Player</title><style>:root{--p:#6b4fc8;--bg:#f4f6fb;--t:#253047;--m:#6d7787}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}header{background:#fff;padding:15px 6%;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 2px 12px #0001}.brand{font-size:21px;font-weight:bold;color:var(--p)}nav{display:flex;gap:7px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:10px 14px;font-weight:bold;cursor:pointer;background:#eceff5;color:var(--t)}.primary{background:var(--p);color:#fff}.hidden{display:none!important}main{max-width:1100px;margin:auto;padding:25px 18px}.view{display:none}.view.active{display:block}.hero,.panel,.card{background:#fff;border-radius:22px;padding:25px;box-shadow:0 8px 25px #0000000d}.hero h1{color:var(--p);margin-top:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:16px}.card{border:0;text-align:left;min-height:150px}.card span{font-size:32px}.muted{color:var(--m)}.auth{max-width:540px;margin:25px auto}.tabs{display:flex;gap:7px;background:#f1eff8;padding:5px;border-radius:14px;margin:15px 0}.tabs button{flex:1}.tabs .active{background:#fff;color:var(--p)}form{display:grid;gap:10px}input,select{padding:13px;border:1px solid #dbe0ea;border-radius:11px;font:inherit;width:100%}.reader{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.pick{background:#fff;border:2px dashed #d9d1f3;border-radius:18px;padding:25px;text-align:center}.pick input{display:none}.pick span{font-size:36px;display:block}.camera{background:#111;padding:12px;border-radius:18px;margin-top:15px;text-align:center}.camera video{width:100%;max-height:60vh;border-radius:12px}.preview img{max-width:100%;max-height:500px;border-radius:12px}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}@media(max-width:700px){header{flex-direction:column;align-items:flex-start}.grid,.reader{grid-template-columns:1fr}}</style></head><body><header><div class="brand">🎼 Partitura Player</div><nav id="nav" class="hidden"><button onclick="show('home')">🏠 Inicio</button><button onclick="show('students')">🎒 Alumnos</button><button onclick="show('reader')">📖 Lector</button><button onclick="logout()">Salir</button></nav></header><main><section id="login" class="view active"><div class="panel auth"><h1>🎶 Bienvenido</h1><p class="muted">Plataforma musical educativa</p><div class="tabs"><button class="active" onclick="tab('in')">Entrar</button><button onclick="tab('up')">Crear cuenta</button></div><form id="in" onsubmit="enter(event)"><input placeholder="Tu nombre" required><button class="primary">Entrar</button></form><form id="up" class="hidden" onsubmit="register(event)"><input id="name" placeholder="Nombre completo" required><select id="role" onchange="inst()"><option value="teacher">👩‍🏫 Profesor</option><option value="student">🎒 Alumno</option></select><select id="instrument" class="hidden"></select><button class="primary">Crear cuenta demo</button></form></div></section><section id="home" class="view"><div class="hero"><h1 id="hello"></h1><p class="muted">Organiza partituras y practica desde cualquier dispositivo.</p></div><div class="grid"><button class="card" onclick="show('students')"><span>🎒</span><h3>Alumnos</h3><p class="muted">Un instrumento por alumno.</p></button><button class="card"><span>🎼</span><h3>Partituras</h3><p class="muted">Biblioteca musical.</p></button><button class="card" onclick="show('reader')"><span>📖</span><h3>Lector</h3><p class="muted">Foto o archivo.</p></button></div></section><section id="students" class="view"><div class="panel"><h1>🎒 Alumnos</h1><p class="muted">Próximamente: sincronización en la nube para profesor y alumnos.</p></div></section><section id="reader" class="view"><h1>📖 Lector de partituras</h1><div class="reader"><button class="pick" onclick="startCamera()"><span>📸</span><b>Hacer una foto</b><small>Usa la cámara</small></button><label class="pick"><span>🖼️</span><b>Subir imagen</b><input type="file" accept="image/*" onchange="loadImage(event)"></label><label class="pick"><span>🎹</span><b>Archivo musical</b><input type="file" onchange="loadMusic(event)"></label></div><div id="camera" class="camera hidden"><video id="video" autoplay playsinline></video><canvas id="canvas" hidden></canvas><div class="actions"><button onclick="capture()" class="primary">📸 Capturar</button><button onclick="stopCamera()">Cerrar</button></div></div><div id="previewBox" class="panel preview hidden"><img id="preview"></div><div id="status" class="panel" style="margin-top:15px">Elige una opción para empezar.</div></section></main><script>const I=['Clarinete','Fagot','Acordeón','Flauta travesera','Guitarra','Violonchelo','Piano','Batería'];let stream=null;instrument.innerHTML='<option value="">Selecciona instrumento</option>'+I.map(x=>'<option>'+x+'</option>').join('');function show(x){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelector('#'+x).classList.add('active')}function tab(x){document.getElementById('in').classList.toggle('hidden',x!='in');document.getElementById('up').classList.toggle('hidden',x!='up')}function inst(){const r=document.getElementById('role');document.getElementById('instrument').classList.toggle('hidden',r.value!='student')}function register(e){e.preventDefault();let u={name:document.getElementById("name").value,role:document.getElementById("role").value,instrument:document.getElementById("instrument").value};if(u.role==='student'&&!u.instrument)return alert('Selecciona un instrumento');localStorage.pp=JSON.stringify(u);go()}function enter(e){e.preventDefault();if(!localStorage.pp)return alert('Primero crea una cuenta demo');go()}function go(){let u=JSON.parse(localStorage.pp);hello.textContent='¡Hola, '+u.name+'! 🎶';nav.classList.remove('hidden');show('home')}function logout(){localStorage.removeItem('pp');location.reload()}async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;camera.classList.remove('hidden');status.textContent='Cámara activada.'}catch(e){alert('Permite el acceso a la cámara.')}}function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;camera.classList.add('hidden')}function capture(){canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);preview.src=canvas.toDataURL('image/png');previewBox.classList.remove('hidden');stopCamera()}function loadImage(e){let f=e.target.files[0];if(f){preview.src=URL.createObjectURL(f);previewBox.classList.remove('hidden')}}function loadMusic(e){if(e.target.files[0])status.textContent='Archivo: '+e.target.files[0].name}if(localStorage.pp)go();</script></body></html>
