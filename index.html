<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6b4fc8"><title>Partitura Player</title><style>body{margin:0;font-family:Arial;background:#f4f6fb;color:#253047}header{background:#fff;padding:15px 6%;display:flex;justify-content:space-between;box-shadow:0 2px 12px #0001}.brand,h1{color:#6b4fc8}button,input,select{padding:12px;border-radius:10px;border:1px solid #dbe0ea;font:inherit}button{cursor:pointer;border:0;font-weight:bold}.primary{background:#6b4fc8;color:#fff}.hidden{display:none!important}main{max-width:1000px;margin:auto;padding:25px 18px}.view{display:none}.view.active{display:block}.panel,.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 25px #0000000d}.auth{max-width:500px;margin:30px auto}.tabs{display:flex;gap:8px;margin:15px 0}.tabs button{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{text-align:left}.muted{color:#6d7787}form{display:grid;gap:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}header{flex-direction:column;gap:10px}}</style></head><body><header><div class="brand">🎼 Partitura Player</div><nav id="nav" class="hidden"><button onclick="show('home')">🏠 Inicio</button><button onclick="show('students')">🎒 Alumnos</button><button onclick="logout()">Salir</button></nav></header><main><section id="login" class="view active"><div class="panel auth"><h1>🎶 Bienvenido</h1><p class="muted">Plataforma musical educativa</p><div class="tabs"><button onclick="tab('in')">Entrar</button><button onclick="tab('up')">Crear cuenta</button></div><form id="in" onsubmit="enter(event)"><input id="emailIn" type="email" placeholder="Email" required><input id="passIn" type="password" placeholder="Contraseña" required><button class="primary">Entrar</button></form><form id="up" class="hidden" onsubmit="register(event)"><input id="name" placeholder="Nombre completo" required><input id="email" type="email" placeholder="Email" required><input id="pass" type="password" minlength="6" placeholder="Contraseña (mínimo 6 caracteres)" required><select id="role" onchange="inst()"><option value="profesor">👩‍🏫 Profesor</option><option value="alumno">🎒 Alumno</option></select><select id="instrument" class="hidden"><option value="">Selecciona instrumento</option><option>Clarinete</option><option>Fagot</option><option>Acordeón</option><option>Flauta travesera</option><option>Guitarra</option><option>Violonchelo</option><option>Piano</option><option>Batería</option></select><button class="primary">Crear cuenta</button></form><p id="msg" class="muted"></p></div></section><section id="home" class="view"><div class="panel"><h1 id="hello"></h1><p class="muted">Tu plataforma musical conectada a la nube.</p></div><div class="grid"><div class="card">🎒<h3>Alumnos</h3><p class="muted">Un instrumento por alumno.</p></div><div class="card">🎼<h3>Partituras</h3><p class="muted">Biblioteca musical.</p></div><div class="card">☁️<h3>Sincronizado</h3><p class="muted">Datos guardados en Supabase.</p></div></div></section><section id="students" class="view"><div class="panel"><h1>🎒 Alumnos</h1><p class="muted">Cada alumno tiene un único instrumento.</p><form onsubmit="addStudent(event)" style="max-width:520px"><input id="studentName" placeholder="Nombre del alumno" required><select id="studentInstrument"><option value="">Selecciona instrumento</option><option>Clarinete</option><option>Fagot</option><option>Acordeón</option><option>Flauta travesera</option><option>Guitarra</option><option>Violonchelo</option><option>Piano</option><option>Batería</option></select><button class="primary">➕ Añadir alumno</button></form><p id="studentMsg" class="muted"></p><div id="studentList" class="grid" style="margin-top:20px"></div></div></section></main><script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://zixwtldnkbhqwqbfdplq.supabase.co','sb_publishable_xvFjwbtCCZpaKRRaXivytQ_O0sdY6gW');
const $=id=>document.getElementById(id);

window.show=function(x){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(x).classList.add('active');if(x==='students')loadStudents()};
window.tab=function(x){$('in').classList.toggle('hidden',x!=='in');$('up').classList.toggle('hidden',x!=='up');$('msg').textContent=''};
window.inst=function(){$('instrument').classList.toggle('hidden',$('role').value!=='alumno')};

window.register=async function(e){
 e.preventDefault();
 const nombre=$('name').value.trim(),correo=$('email').value.trim(),clave=$('pass').value,rol=$('role').value,instrumento=$('instrument').value;
 if(!nombre||!correo||!clave){$('msg').textContent='Completa todos los campos';return}
 if(rol==='alumno'&&!instrumento){$('msg').textContent='Selecciona un instrumento';return}
 $('msg').textContent='Creando cuenta...';
 const {data,error}=await supabase.auth.signUp({email:correo,password:clave,options:{data:{nombre,rol,instrumento:rol==='alumno'?instrumento:null}}});
 if(error){$('msg').textContent='❌ '+error.message;return}
 $('msg').textContent=data.session?'✅ Cuenta creada correctamente.':'✅ Cuenta creada. Revisa tu correo para confirmarla.';
};

window.enter=async function(e){
 e.preventDefault();$('msg').textContent='Entrando...';
 const {data,error}=await supabase.auth.signInWithPassword({email:$('emailIn').value.trim(),password:$('passIn').value});
 if(error){$('msg').textContent='❌ '+error.message;return}
 go(data.user);
};

async function go(user){$('hello').textContent='¡Hola, '+(user.user_metadata?.nombre||user.email)+'! 🎶';$('nav').classList.remove('hidden');window.show('home')}
window.logout=async function(){await supabase.auth.signOut();location.reload()};

window.addStudent=async function(e){
 e.preventDefault();$('studentMsg').textContent='Guardando...';
 const nombre=$('studentName').value.trim(),instrumento=$('studentInstrument').value;
 if(!instrumento){$('studentMsg').textContent='Selecciona un instrumento';return}
 const {data:{user}}=await supabase.auth.getUser();
 const {error}=await supabase.from('students').insert({name:nombre,instrument:instrumento,teacher_id:user.id});
 if(error){$('studentMsg').textContent='❌ '+error.message;return}
 $('studentName').value='';$('studentInstrument').value='';$('studentMsg').textContent='✅ Alumno añadido correctamente';loadStudents();
};

async function loadStudents(){
 const {data:{user}}=await supabase.auth.getUser();if(!user)return;
 const {data,error}=await supabase.from('students').select('*').eq('teacher_id',user.id).order('name');
 if(error){$('studentList').innerHTML='<p class="muted">Todavía no hay alumnos guardados.</p>';return}
 $('studentList').innerHTML=(data||[]).map(s=>'<div class="card">🎒<h3>'+s.name+'</h3><p class="muted">🎵 '+s.instrument+'</p></div>').join('')||'<p class="muted">Todavía no tienes alumnos.</p>';
}

const {data:{session}}=await supabase.auth.getSession();if(session)go(session.user);
</script></body></html>
