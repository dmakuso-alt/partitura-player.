<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partitura Promenade</title><style>body{margin:0;padding:12px;font-family:Arial,sans-serif;background:#fff;color:#253047}#status{color:#6d7787;font-size:14px;margin:4px 0 12px}#score{width:100%;overflow:auto}button{padding:9px 14px;border:0;border-radius:9px;background:#6b4fc8;color:#fff;font-weight:bold;cursor:pointer}</style><script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.2/build/opensheetmusicdisplay.min.js"></script></head><body><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button id="reload">↻ Recargar partitura</button><span id="status">Preparando partitura...</span></div><div id="score">Cargando...</div><script>(async()=>{const status=document.getElementById('status'),target=document.getElementById('score');let cursor=null;async function render(){status.textContent='Cargando la partitura original...';target.textContent='';try{const lib=window.opensheetmusicdisplay;if(!lib||!lib.OpenSheetMusicDisplay)throw Error('No se ha cargado el visor musical. Comprueba la conexión.');const response=await fetch('./assets/promenade.musicxml',{cache:'no-store'});if(!response.ok)throw Error('No se encuentra el archivo MusicXML ('+response.status+').');const musicxml=await response.text();const osmd=new lib.OpenSheetMusicDisplay(target,{autoResize:true,backend:'svg',drawTitle:false,drawPartNames:true,followCursor:true});await osmd.load(musicxml);osmd.render();cursor=osmd.cursor;cursor.show();cursor.reset();status.textContent='Partitura de Promenade cargada · 2 voces · cursor listo';}catch(err){status.textContent='Error: '+err.message;target.textContent='No se pudo mostrar la partitura.';console.error(err)}}let lastStepSeconds=0,receivedMessages=0;window.promenaCursorControl=function(type,seconds=0){if(!cursor){status.textContent='La partitura aún no ha terminado de cargar';return}try{if(type==='PROMENADE_CURSOR_RESET'){cursor.reset();cursor.show();lastStepSeconds=0;status.textContent='Cursor conectado · esperando reproducción';return}if(type==='PROMENADE_CURSOR_TIME'){const elapsed=Math.max(0,Number(seconds)||0);const steps=Math.floor(elapsed/0.28);while(lastStepSeconds<steps&&lastStepSeconds<1000){cursor.next();cursor.update();lastStepSeconds++}if(receivedMessages++%20===0)status.textContent='Cursor conectado · avance '+lastStepSeconds+' posiciones'}}catch(err){status.textContent='Error moviendo cursor: '+err.message;console.error(err)}};window.addEventListener('message',event=>{const d=event.data;if(d&&d.type)window.promenaCursorControl(d.type,d.seconds||0)});document.getElementById('reload').addEventListener('click',render);await render()})();</script></body></html>
